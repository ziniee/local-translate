name: Build & Release Windows Portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package_mode:
        description: 'Build target (portable only or portable + installer)'
        required: true
        default: 'github'
        type: choice
        options:
          - github
          - portable
          - installer

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Unit Tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Fetch llama.cpp Windows engines (Vulkan + CPU)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm fetch:engines:lite

      - name: Build Windows Distribution
        run: |
          $mode = "${{ github.event.inputs.package_mode || 'github' }}"
          if ($mode -eq "portable") {
            pnpm build:portable
          } elseif ($mode -eq "installer") {
            pnpm build:installer
          } else {
            pnpm build:github
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalTranslate-Windows-${{ github.ref_name }}
          path: |
            release/LocalTranslate-*-win-x64-portable.zip
            release/LocalTranslate-*-win-x64-setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release (on v* tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/LocalTranslate-*-win-x64-portable.zip
            release/LocalTranslate-*-win-x64-setup.exe
            release/SHA256SUMS.txt
